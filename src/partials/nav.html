<!-- ============================== NAVBAR ============================== -->
<header class="nav" id="top">
  <div class="shell shell--wide nav__inner">
    <a class="nav__brand" href="index.html" aria-label="RenderFrost SMP — home">
      <svg class="nav__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M16 2 L29 10 v12 L16 30 L3 22 V10 Z" stroke="currentColor" stroke-width="1.2" opacity=".5"/>
        <path d="M16 8.5 L23.5 13 v7 L16 24.5 L8.5 20 v-7 Z" stroke="currentColor" stroke-width="1.4"/>
        <path d="M16 8.5 V24.5 M8.5 13 L23.5 20 M23.5 13 L8.5 20" stroke="currentColor" stroke-width=".9" opacity=".55"/>
        <circle cx="16" cy="16.5" r="2.1" fill="currentColor"/>
      </svg>
      <span class="nav__wordmark"><b>RENDERFROST</b><span>SMP</span></span>
    </a>

    <nav aria-label="Primary">
      <ul class="nav__links">
{{NAV_LINKS}}
      </ul>
    </nav>

    <div class="nav__actions">
      <!-- Soundtrack control. Silent until the visitor presses play. -->
      <div class="music">
        <button class="music__toggle" type="button" aria-label="Play soundtrack" aria-pressed="false">
          <svg class="music__icon" data-music="play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.2-6.8c.6-.4.6-1.4 0-1.8L9.6 4.3c-.7-.4-1.6.1-1.6.9Z"/>
          </svg>
          <svg class="music__icon music__icon--hidden" data-music="pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="6.5" y="4.5" width="3.6" height="15" rx="1.1"/>
            <rect x="13.9" y="4.5" width="3.6" height="15" rx="1.1"/>
          </svg>
          <span class="music__eq" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>

        <button class="music__knob" type="button" data-music="pop" aria-label="Soundtrack volume and settings" aria-expanded="false" aria-controls="music-pop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/>
            <circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>
          </svg>
        </button>

        <div class="music__pop" id="music-pop" role="group" aria-label="Soundtrack volume">
          <button class="music__pop-close" type="button" data-music="pop-close" aria-label="Close volume controls">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18"/>
            </svg>
          </button>
          <div class="music__pop-head">
            <span class="music__pop-title">Soundtrack</span>
            <span class="music__value">40%</span>
          </div>
          <div class="music__row">
            <button class="music__mini" type="button" data-music="mute" aria-label="Mute soundtrack">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="M15.5 9.5a4 4 0 0 1 0 5"/>
              </svg>
            </button>
            <button class="music__mini music__icon--hidden" type="button" data-music="unmute" aria-label="Unmute soundtrack">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/>
              </svg>
            </button>
            <input class="music__slider" type="range" min="0" max="100" step="1" value="40"
                   data-music="volume" aria-label="Soundtrack volume">
          </div>
          <p class="music__note">Music is optional and starts only when you press play.</p>
        </div>
      </div>

      <a class="btn btn--primary" href="join.html">
        Join the server
        <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h13M13 6l6 6-6 6"/>
        </svg>
      </a>

      <button class="nav__toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
        <span class="nav__toggle-box" aria-hidden="true"><span></span><span></span></span>
      </button>
    </div>
  </div>
</header>
