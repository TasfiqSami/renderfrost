name = "renderfrost-status"
main = "status-worker.js"
compatibility_date = "2026-01-01"

# Route the Worker onto your own domain so the site calls it same-origin.
# Replace with your zone, then uncomment:
# routes = [{ pattern = "renderfrost.com/api/status", zone_name = "renderfrost.com" }]

[vars]
PTERO_URL = "https://portal.renderfrost.com"
PTERO_SERVER_ID = "0a560cd0"
MC_HOST = "play.renderfrost.com"
SHOW_WHITELIST = "false"

# The API key is NOT stored here. Add it as a secret:
#   npx wrangler secret put PTERO_API_KEY
